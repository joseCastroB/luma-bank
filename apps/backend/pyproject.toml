# Configuracion de herramientas (pytest, ruff). Las DEPENDENCIAS viven en
# requirements.txt / requirements-dev.txt con pines exactos (==).

[project]
name = "luma-bank-backend"
version = "0.1.0"
description = "Luma Bank - API (Django + DRF)"
requires-python = "==3.13.*"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
# S101 (assert) permitido en tests; DJ (flake8-django) activo.

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"tests/**" = ["S101", "S105", "S106", "S107"]
"**/settings/*.py" = ["S105"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/wsgi.py", "config/asgi.py"]
