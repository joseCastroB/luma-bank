# Luma Bank - configuracion base (pensada para produccion).
# Para desarrollo local se aplica ADEMAS docker-compose.override.yml
# automaticamente (hot reload, puertos expuestos, deps de test).
#
# Todas las imagenes con tag explicito (nunca :latest). Ver /VERSIONS.md.

name: luma-bank

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luma}
      POSTGRES_DB: ${POSTGRES_DB:-luma}
    volumes:
      # PostgreSQL 18+ recomienda montar un unico volumen en /var/lib/postgresql
      # (guarda los datos en un subdirectorio por version). Montar en
      # /var/lib/postgresql/data como antes hace que la imagen aborte.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luma} -d ${POSTGRES_DB:-luma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Defaults solo para desarrollo local. En produccion se DEBEN definir en .env.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-luma-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Crea el bucket de embeddings al arrancar y sale.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_EMBEDDINGS} &&
      echo 'bucket listo: '$${MINIO_BUCKET_EMBEDDINGS}
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-luma-minio-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-minio-secret}
      MINIO_BUCKET_EMBEDDINGS: ${MINIO_BUCKET_EMBEDDINGS:-luma-face-embeddings}
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  valkey_data:
  minio_data:
