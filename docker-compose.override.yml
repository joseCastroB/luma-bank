# Luma Bank - overrides de DESARROLLO.
# Docker Compose lo aplica automaticamente encima de docker-compose.yml.
# Aqui va: hot reload, codigo montado como volumen, puertos expuestos al host
# y dependencias de test. NO usar en produccion.

services:
  postgres:
    ports:
      - "5432:5432"

  valkey:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web

  backend:
    build:
      target: dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./apps/backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    # host y puerto (5173, strictPort) ya estan en vite.config.ts
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"

volumes:
  frontend_node_modules:
